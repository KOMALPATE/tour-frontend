<div class="timeline-card">
  <div class="timeline-header">
    <h2>📋 Inquiry Timeline</h2>
  </div>

  <div class="timeline">
    <div class="timeline-item" *ngFor="let item of timelineData">
      <div class="dot"></div>

      <div class="content">
        <div class="top">
          <h4>{{ item.status }}</h4>

          <span class="time">
            {{ item.created_at }}
          </span>
        </div>

        <p>{{ item.remarks }}</p>
      </div>
    </div>
  </div>
</div>
