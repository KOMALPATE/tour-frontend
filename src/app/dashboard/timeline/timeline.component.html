<div class="tl-card">
  <div class="tl-head">
    <h2>Inquiry Timeline</h2>
  </div>

  <div class="tl-list">
    <div class="tl-item" *ngFor="let item of timelineData">
      <span class="tl-dot"></span>

      <div class="tl-box">
        <div class="tl-top">
          <h4>{{ item.status }}</h4>
          <span>{{ item.created_at }}</span>
        </div>

        <p>{{ item.remarks }}</p>
      </div>
    </div>
  </div>
</div>
