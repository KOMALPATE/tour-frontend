<div class="dialog-container">
  <div class="card-view">
    <h2>Add Package</h2>

    <form [formGroup]="packageForm" (ngSubmit)="addPackage()">
      <div class="form-group">
        <label>Package Name</label>
        <input type="text" formControlName="package_name" />
      </div>

      <div class="form-group">
        <label>Destination</label>
        <input type="text" formControlName="destination" />
      </div>

      <div class="form-group">
        <label>Price</label>
        <input type="number" formControlName="price" />
      </div>

      <div class="form-group">
        <label>Duration Days</label>
        <input type="number" formControlName="duration_days" />
      </div>

      <div class="form-group">
        <label>Duration Nights</label>
        <input type="number" formControlName="duration_nights" />
      </div>

      <div class="form-group">
        <label>Hotel Name</label>
        <input type="text" formControlName="hotel_name" />
      </div>

      <div class="form-group">
        <label>Status</label>
        <select formControlName="status">
          <option value="Active">Active</option>
          <option value="Inactive">Inactive</option>
        </select>
      </div>

      <div class="btn-group">
        <button
          type="button"
          class="cancel-btn"
          (click)="closeDialog()"
          [disabled]="loading"
        >
          Cancel
        </button>

        <button type="submit" class="save-btn" [disabled]="loading">
          {{ loading ? "Saving..." : "Save Package" }}
        </button>
      </div>
    </form>
  </div>
</div>
