<tbody>
  <ng-container *ngFor="let item of inquiries">
    <tr>
      <td>{{ item.customer_name }}</td>
      <td>{{ item.phone }}</td>
      <td>{{ item.destination }}</td>
      <td>{{ item.status }}</td>

      <td>
        <button class="timeline-btn" (click)="viewTimeline(item.id)">
          Timeline
        </button>
      </td>
    </tr>

    <tr *ngIf="selectedInquiryId === item.id">
      <td colspan="6">
        <div class="timeline-container">
          <div class="timeline-step" *ngFor="let step of timelineData">
            <div class="timeline-icon">✓</div>

            <div class="timeline-content">
              <div class="timeline-header">
                <h4>{{ step.status }}</h4>

                <span>
                  {{ step.created_at }}
                </span>
              </div>

              <p>{{ step.remarks }}</p>
            </div>
          </div>
        </div>
      </td>
    </tr>
  </ng-container>
</tbody>
