<div class="dashboard">
  <!-- SIDEBAR -->

  <div class="sidebar">
    <div class="logo">
      <h2>Travel Admin</h2>
    </div>

    <ul class="menu">
      <li class="active"><span>🏠</span> Dashboard</li>

      <li (click)="tour()"><span>✈️</span> Tours</li>

      <li (click)="package()"><span>📦</span> Packages</li>

      <li><span>🏨</span> Hotels</li>

      <li><span>📋</span> Bookings</li>

      <li (click)="users()"><span>👤</span> Users</li>

      <li (click)="inquiries()"><span>📩</span> Inquiries</li>

      <li (click)="logout()"><span>🚪</span> Logout</li>
    </ul>
  </div>

  <!-- MAIN CONTENT -->

  <div class="main-content">
    <!-- HEADER -->

    <div class="header">
      <div>
        <h1>Dashboard</h1>
        <p>Welcome Back Admin 👋</p>
      </div>

      <div class="admin-profile">
        <img src="https://i.pravatar.cc/40" alt="" />

        <div>
          <h4>Admin</h4>
          <p>Administrator</p>
        </div>
      </div>
    </div>

    <!-- CARDS -->

    <div class="cards">
      <div class="card">
        <h2>150</h2>
        <p>Total Tours</p>
      </div>

      <div class="card">
        <h2>320</h2>
        <p>Total Bookings</p>
      </div>

      <div class="card">
        <h2>85</h2>
        <p>Total Hotels</p>
      </div>

      <div class="card">
        <h2>1200</h2>
        <p>Total Users</p>
      </div>
    </div>
    <router-outlet></router-outlet>
  </div>
</div>
